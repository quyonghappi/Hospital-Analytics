substitutions:
  _REGION: "asia-southeast1"
  _PROJECT_ID: "project-8e2366a6-d3cc-40ee-9de"
  _AR_REPO: "hospital-ml"
  _IMAGE_NAME: "hospital-ml-pipeline"

steps:
  # 1. BUILD DOCKER IMAGE
  # Chạy từ thư mục gốc, nhưng file Docker và context trỏ vào ml_pipeline/
  - name: "gcr.io/cloud-builders/docker"
    id: "build-ml-image"
    args:
      - "build"
      - "--tag"
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:$SHORT_SHA"
      - "--tag"
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:latest"
      - "--cache-from"
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:latest"
      - "--file"
      - "ml_pipeline/infra/Dockerfile"
      - "ml_pipeline"

  # 2. PUSH SHA TAG (Versioned Image)
  - name: "gcr.io/cloud-builders/docker"
    id: "push-sha"
    waitFor: ["build-ml-image"]
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:$SHORT_SHA"

  # 3. PUSH LATEST TAG (Cache Image)
  - name: "gcr.io/cloud-builders/docker"
    id: "push-latest"
    waitFor: ["build-ml-image"]
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:latest"

  # 4. SMOKE CHECK (Đảm bảo Image có thể pull được từ Artifact Registry)
  - name: "gcr.io/cloud-builders/docker"
    id: "smoke-check"
    waitFor: ["push-sha"]
    args:
      - "pull"
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:$SHORT_SHA"

images:
  - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:$SHORT_SHA"
  - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:latest"

options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY

timeout: "1800s"
